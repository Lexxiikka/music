<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Музыка блеска</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Underdog&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Underdog', Calibri, system-ui, sans-serif;
        }

        body {
            font-synthesis: none;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        #bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
            background: #000;
        }

        #bg-strip {
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            will-change: transform;
        }

        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            object-fit: cover;
        }

        #bg-video-2 {
            left: 50%;
        }

        #bg-seam {
            position: absolute;
            top: 0;
            left: 50%;
            width: clamp(220px, 24vw, 420px);
            height: 100%;
            transform: translateX(-50%);
            background: linear-gradient(90deg,
                    rgba(0, 0, 0, 0) 0%,
                    rgba(0, 0, 0, 0.35) 18%,
                    rgba(0, 0, 0, 0.78) 36%,
                    #000 50%,
                    rgba(0, 0, 0, 0.78) 64%,
                    rgba(0, 0, 0, 0.35) 82%,
                    rgba(0, 0, 0, 0) 100%);
            opacity: 0;
            pointer-events: none;
            z-index: 3;
        }

        .hidden {
            display: none !important;
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            cursor: pointer;
        }

        #start-text {
            font-size: 24px;
            color: #fff;
            text-align: center;
        }

        #track-selector-screen {
            position: fixed;
            inset: 0;
            z-index: 28;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            opacity: 1;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }

        #track-selector-screen.selector-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        #track-carousel-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        #track-carousel-rail {
            display: flex;
            align-items: center;
            gap: 48px;
            will-change: transform;
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            padding: 20px 0;
        }

        .track-card {
            width: 240px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            cursor: pointer;
            transform: scale(0.75);
            opacity: 0.48;
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
        }

        .track-card:hover:not(.active) {
            opacity: 0.75;
            transform: scale(0.8);
        }

        .track-card.active {
            transform: scale(1);
            opacity: 1;
        }

        .track-load-box {
            width: 200px;
            min-height: 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            gap: 6px;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
        }

        .track-card.active .track-load-box.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .track-load-label {
            font-size: 14px;
            color: #e6c7ff;
            text-shadow: 0 0 8px rgba(124, 0, 255, 0.85);
            letter-spacing: 0.5px;
        }

        .track-load-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(124, 0, 255, 0.5);
            border-radius: 999px;
            overflow: hidden;
        }

        .track-load-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #6764f0, #a61fd3, #da91e6);
            border-radius: 999px;
            transition: width 0.15s linear;
        }

        .track-icon-frame {
            position: relative;
            width: 210px;
            height: 210px;
            border: 2px solid rgba(124, 0, 255, 0.35);
            background: rgba(20, 10, 35, 0.8);
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            transition: border-color 0.35s ease, box-shadow 0.35s ease;
        }

        .track-card.active .track-icon-frame {
            border-color: #9d3bff;
            box-shadow:
                0 0 25px rgba(124, 0, 255, 0.75),
                0 0 55px rgba(124, 0, 255, 0.35);
        }

        .track-icon-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        .track-play-badge {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.32);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .track-card.active:not(.loading):hover .track-play-badge {
            opacity: 1;
        }

        .track-play-badge img {
            width: 58px;
            height: 58px;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(124, 0, 255, 0.9));
        }

        .track-card-meta {
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .track-card-title {
            font-size: 1.25em;
            font-weight: bold;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
        }

        .track-card.active .track-card-title {
            text-shadow: 0 0 14px rgba(124, 0, 255, 0.75);
        }

        .track-card-artist {
            font-size: 0.95em;
            color: rgba(255, 255, 255, 0.72);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #music-player-panel {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 35%;
            min-width: 500px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid #7c00ff;
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 25;
            box-shadow: 0px 0px 0px rgba(0, 0, 0, 0);
        }

        #player-load-bar {
            position: absolute;
            inset: -1px;
            border-radius: 15px;
            overflow: hidden;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 2;
        }

        #player-load-bar.visible {
            opacity: 1;
            visibility: visible;
        }

        #player-load-fill {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #6764f0, #a61fd3, #da91e6);
            box-shadow: 0 0 12px rgba(166, 31, 211, 0.95);
            transform-origin: left center;
            transform: scaleX(0);
            transition: transform 0.25s linear;
            will-change: transform;
        }

        #player-load-bar.indeterminate #player-load-fill {
            width: 35%;
            transform: none;
            transition: none;
            animation: playerLoadSweep 1.1s ease-in-out infinite;
        }

        @keyframes playerLoadSweep {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(290%);
            }
        }

        #player-load-label {
            position: absolute;
            left: 0;
            bottom: calc(100% + 10px);
            max-width: 100%;
            padding: 6px 14px;
            font-size: 12.5px;
            letter-spacing: 0.2px;
            color: rgba(255, 255, 255, 0.92);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(124, 0, 255, 0.65);
            border-radius: 999px;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transform: translateY(6px);
            transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
        }

        #player-load-label.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .nav-btn-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-tooltip {
            position: absolute;
            bottom: calc(100% + 14px);
            left: 50%;
            transform: translateX(-50%) translateY(6px);
            background: rgba(10, 6, 18, 0.92);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(159, 70, 167, 0.75);
            border-radius: 10px;
            padding: 8px 13px;
            min-width: 140px;
            max-width: 240px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7), 0 0 14px rgba(124, 0, 255, 0.35);
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
            z-index: 40;
        }

        .nav-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px;
            border-style: solid;
            border-color: rgba(159, 70, 167, 0.75) transparent transparent transparent;
        }

        .nav-btn-wrap:hover .nav-tooltip,
        .nav-btn-wrap:has(button:focus-visible) .nav-tooltip {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .nav-tooltip-title {
            font-size: 18px;
            font-weight: bold;
            color: #8668ca;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }

        .nav-tooltip-artist {
            font-size: 13px;
            color: #8242bc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
            line-height: 1.25;
        }

        .player-top {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .player-progress {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .player-progress span {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.75);
            min-width: 38px;
            font-variant-numeric: tabular-nums;
            user-select: none;
        }

        #current-time {
            text-align: left;
        }

        #total-duration {
            text-align: right;
        }

        #track-seek-slider {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background:
                linear-gradient(to right, transparent var(--progress, 0%), #3a3a3f var(--progress, 0%)),
                linear-gradient(to right, #6764f0 0%, #da91e6 100%);
            outline: none;
            cursor: pointer;
        }

        #track-seek-slider::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 3px;
            background: transparent;
        }

        #track-seek-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -4px;
            box-shadow: 0 0 6px rgba(166, 31, 211, 0.9);
            transition: transform 0.15s ease;
        }

        #track-seek-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        #track-seek-slider::-moz-range-track {
            background: transparent;
            height: 6px;
            border-radius: 3px;
            border: none;
        }

        #track-seek-slider::-moz-range-progress {
            background: transparent;
            height: 6px;
            border-radius: 3px;
        }

        #track-seek-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(166, 31, 211, 0.9);
        }

        #preload-toast {
            position: fixed;
            bottom: 40px;
            right: 40px;
            z-index: 26;
            width: 340px;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(10px);
            border: 1px solid #7c00ff;
            border-radius: 15px;
            padding: 22px 24px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 15px;
            letter-spacing: 0.4px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            box-shadow: 0 0 24px rgba(0, 0, 0, 0.55);
            pointer-events: none;
            opacity: 0;
            transform: translateY(12px);
            visibility: hidden;
            transition:
                opacity 0.35s ease,
                transform 0.35s ease,
                visibility 0.35s ease,
                box-shadow 0.5s ease,
                border-color 0.5s ease;
        }

        #preload-toast.visible {
            opacity: 1;
            transform: translateY(0);
            visibility: visible;
        }

        #preload-toast.loaded {
            border-color: rgba(0, 210, 85, 0.65);
            box-shadow:
                0 -6px 14px -3px rgba(0, 210, 85, 0.75),
                0 0 24px rgba(0, 0, 0, 0.55);
        }

        #preload-toast-text {
            display: inline-block;
            will-change: transform, opacity;
        }

        .player-left {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .track-info {
            text-align: left;
            will-change: transform, opacity;
        }

        #track-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #fff;
        }

        #track-artist {
            font-size: 1em;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 5px;
        }

        .player-right {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .player-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .player-svg-defs {
            position: absolute;
            width: 0;
            height: 0;
            pointer-events: none;
        }

        .player-controls button {
            background: transparent;
            border: none;
            width: 45px;
            height: 45px;
            cursor: pointer;
            transition: transform 0.3s, opacity 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .player-controls button svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .player-controls button:hover {
            transform: scale(1.1);
            opacity: 0.85;
        }

        .player-controls #play-pause-btn {
            width: 55px;
            height: 55px;
            position: relative;
        }

        .player-controls #menu-btn {
            width: 38px;
            height: 38px;
            border: 1px solid rgba(159, 70, 167, 0.65);
            border-radius: 10px;
            padding: 7px;
            background: rgba(124, 0, 255, 0.14);
        }

        .player-volume {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-volume .volume-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            display: block;
        }

        .player-volume input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 130px;
            height: 6px;
            border-radius: 3px;
            background:
                linear-gradient(to right, transparent var(--vol, 30%), #3a3a3f var(--vol, 30%)),
                linear-gradient(to right, #420061 0%, #6a0ccf 50%, #ff0000 100%);
            outline: none;
            cursor: pointer;
            margin: 0;
            padding: 0;
        }

        .player-volume input[type="range"]::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 3px;
            background: transparent;
        }

        .player-volume input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.65);
            transition: transform 0.15s ease;
        }

        .player-volume input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        .player-volume input[type="range"]::-moz-range-track {
            background: transparent;
            height: 6px;
            border-radius: 3px;
            border: none;
        }

        .player-volume input[type="range"]::-moz-range-progress {
            background: transparent;
            height: 6px;
            border-radius: 3px;
        }

        .player-volume input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.65);
        }

        #subtitles-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 15;
            pointer-events: none;
        }

        #subtitles-text {
            font-size: 40px;
            color: #fff;
            text-align: center;
            max-width: 80%;
            padding: 20px 15px;
            text-shadow:
                0 0 10px rgba(124, 0, 255, 0.8),
                0 0 20px rgba(124, 0, 255, 0.5),
                0 0 40px rgba(124, 0, 255, 0.3),
                0 0 80px rgba(124, 0, 255, 0.1);
            opacity: 0;
            transform: scale(0.8) translateY(20px);
            transition: none;
            letter-spacing: 2px;
            line-height: 1.6;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(124, 0, 255, 0.2);
        }

        #subtitles-text.show {
            animation: subsFadeIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        #subtitles-text.hide {
            animation: subsFadeOut 0.3s cubic-bezier(0.55, 0, 1, 0.45) forwards;
        }

        @keyframes subsFadeIn {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(20px);
                filter: blur(10px);
            }

            60% {
                filter: blur(0px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0px);
            }
        }

        @keyframes subsFadeOut {
            0% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0px);
            }

            100% {
                opacity: 0;
                transform: scale(1.1) translateY(-20px);
                filter: blur(6px);
            }
        }

        .load-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 72px;
            height: 72px;
            margin: -36px 0 0 -36px;
            transform: rotate(-90deg);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s;
            pointer-events: none;
        }

        .load-ring.visible {
            opacity: 1;
            visibility: visible;
        }

        .load-ring circle {
            fill: none;
            stroke-width: 4;
        }

        .load-ring .ring-bg {
            stroke: rgba(255, 255, 255, 0.2);
        }

        .load-ring .ring-fg {
            stroke: #a61fd3;
            stroke-linecap: round;
            stroke-dasharray: 194.78;
            stroke-dashoffset: 194.78;
            transition: stroke-dashoffset 0.2s linear;
        }

        .load-ring.indeterminate {
            animation: ringSpin 1s linear infinite;
        }

        .load-ring.indeterminate .ring-fg {
            stroke-dashoffset: 146;
            transition: none;
        }

        @keyframes ringSpin {
            from {
                transform: rotate(-90deg);
            }

            to {
                transform: rotate(270deg);
            }
        }

        #debug-time-display {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 9999;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            color: #0f0;
            background: rgba(0, 0, 0, 0.75);
            padding: 6px 16px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 0, 0.3);
            user-select: none;
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            gap: 10px;
            letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(0, 255, 0, 0.4);
            transition: border-color 0.2s, box-shadow 0.2s;
            min-width: 150px;
            justify-content: center;
        }

        #debug-time-display:hover {
            border-color: rgba(0, 255, 0, 0.8);
            box-shadow: 0 0 12px rgba(0, 255, 0, 0.3);
        }

        .debug-seek-btn {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.3);
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .debug-seek-btn:hover {
            background: rgba(0, 255, 0, 0.25);
        }

        .debug-seek-btn:active {
            transform: scale(0.95);
        }

        #debug-time-text {
            cursor: pointer;
            min-width: 90px;
            text-align: center;
        }

        #debug-seek-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10000;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(0, 255, 0, 0.4);
            border-radius: 12px;
            padding: 24px 28px;
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            align-items: stretch;
            gap: 14px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.15);

        }

        #debug-seek-modal.open {

        #debug-seek-modal .modal-title {

        #debug-seek-modal input {

            text-align: center;

        .debug-subs-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Courier New', monospace;

        #debug-seek-modal .modal-actions {

        #debug-seek-modal .modal-actions button.cancel:hover {

        #error-toasts {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10001;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: min(520px, 90vw);
            pointer-events: none;
        }

        .error-toast {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 14px;
            background: rgba(40, 0, 10, 0.92);
            border: 1px solid #ff4d6d;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            line-height: 1.4;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.35);
            pointer-events: auto;
            animation: toastIn 0.3s ease-out;
        }

        .error-toast.out {
            animation: toastOut 0.3s ease-in forwards;
        }

        .error-toast span {
            flex: 1;
            word-break: break-word;
        }

        .error-toast button {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            opacity: 0.7;
        }

        .error-toast button:hover {
            opacity: 1;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes toastOut {
            to {
                opacity: 0;
                transform: translateY(-15px);
            }
        }

        @media (max-width: 700px) {
            * {
                display: none;
            }
        }
    </style>
</head>

<body>

            <div class="player-progress">

    <div id="debug-time-display">

    <div id="subtitles-overlay">
