    <audio id="music-player-1" preload="auto"></audio>
    <audio id="music-player-2" preload="auto"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        let musicList = [];
        const DEBUG_ENABLED = new URLSearchParams(location.search).has('debug');
        const assetCache = new Map();
        const failedAssets = [];
        const MIME = {
            mp4: 'video/mp4',
            mp3: 'audio/mpeg',
            png: 'image/png',
            jpg: 'image/jpeg',
            jpeg: 'image/jpeg',
            webp: 'image/webp',
            gif: 'image/gif',
            svg: 'image/svg+xml'
        };
        const cached = (src) => assetCache.get(src) ?? src;

        function parseMultiplier(value) {
            if (value === null || value === undefined || value === '') return 1;
            const num = Number(value);
            return Number.isFinite(num) && num >= 0 ? num : 1;
        }

        function parseRoundIcon(value) {
            const num = Number(value);
            if (!Number.isFinite(num)) return 0;
            return Math.min(50, Math.max(0, num));
        }

        function clampVolume(value) {
            return Math.min(1, Math.max(0, value));
        }

        function showError(message) {
            console.error(message);
            const box = document.getElementById('error-toasts');
            if (!box) return;
            while (box.children.length >= 4) box.firstChild.remove();
            const el = document.createElement('div');
            el.className = 'error-toast';
            el.setAttribute('role', 'alert');
            const text = document.createElement('span');
            text.textContent = '\u26A0 ' + message;
            const close = document.createElement('button');
            close.textContent = '\u00D7';
            close.setAttribute('aria-label', 'Закрыть');
            const dismiss = () => { el.classList.add('out'); setTimeout(() => el.remove(), 300); };
            close.addEventListener('click', dismiss);
            setTimeout(dismiss, 12000);
            el.append(text, close);
            box.appendChild(el);
        }

        function reportAsset(src, reason) {
            if (failedAssets.includes(src)) return;
            failedAssets.push(src);
            showError(`Не удалось загрузить файл: ${src}${reason ? ' (' + reason + ')' : ''}`);
        }

        async function fetchToBlobUrl(src, onProgress = () => { }) {
            const res = await fetch(src);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const encoded = res.headers.get('Content-Encoding');
            const total = encoded && encoded !== 'identity' ? 0 : (+res.headers.get('Content-Length') || 0);
            const reader = res.body.getReader();
            const chunks = [];
            let loaded = 0;
            for (; ;) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                loaded += value.length;
                onProgress(total ? Math.min(loaded / total, 0.99) : 0, loaded, total);
            }
            const ext = src.split('.').pop().toLowerCase();
            const blob = new Blob(chunks, { type: MIME[ext] || res.headers.get('Content-Type') || '' });
            const url = URL.createObjectURL(blob);
            assetCache.set(src, url);
            onProgress(1, loaded, loaded);
            return url;
        }

        const inflight = new Map();
        function loadAsset(src, onProgress = () => { }) {
            if (assetCache.has(src)) { onProgress(1, 0, 0); return Promise.resolve(assetCache.get(src)); }
            let job = inflight.get(src);
            if (!job) {
                job = { listeners: new Set(), last: [0, 0, 0] };
                job.promise = fetchToBlobUrl(src, (...args) => { job.last = args; job.listeners.forEach(f => f(...args)); })
                    .finally(() => inflight.delete(src));
                inflight.set(src, job);
            }
            job.listeners.add(onProgress);
            onProgress(...job.last);
            return job.promise;
        }

        function loadAssetsWithProgress(srcs, onProgress = () => { }) {
            const state = srcs.map(() => ({ loaded: 0, total: 0, done: false }));
            const report = () => {
                let loaded = 0, total = 0, known = true;
                state.forEach(s => {
                    if (s.done) { loaded += s.loaded; total += s.loaded; return; }
                    if (!s.total) known = false;
                    loaded += s.loaded;
                    total += s.total;
                });
                const ratio = known && total > 0 ? Math.min(1, loaded / total) : 0;
                onProgress({ ratio, loaded, total, known: known && total > 0 });
            };
            report();
            return Promise.all(srcs.map((src, i) =>
                loadAsset(src, (p, loaded, total) => {
                    state[i].loaded = loaded;
                    state[i].total = total;
                    if (p >= 1) state[i].done = true;
                    report();
                }).catch(err => {
                    state[i].done = true;
                    reportAsset(src, err.message);
                    report();
                })
            ));
        }

        function decodeImage(src) {
            const img = new Image();
            img.src = src;
            return img.decode().then(() => true, () => false);
        }

        async function preloadImageAsset(src, onProgress = () => { }) {
            const blobUrl = await loadAsset(src, (p) => onProgress(p * 0.9));
            const ok = await decodeImage(blobUrl);
            if (!ok) throw new Error('ошибка декодирования изображения');
            onProgress(1);
            return blobUrl;
        }

        async function loadMusicConfig() {
            try {
                const response = await fetch('music_config.json', { cache: 'no-cache' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} ${response.statusText}`);
                }
                const data = await response.json();
                const list = Array.isArray(data) ? data : data && data.tracks;
                if (!Array.isArray(list)) {
                    throw new Error('в music_config.json нет массива треков (ожидается [...] или {"tracks": [...]})');
                }
                musicList = list;
            } catch (err) {
                console.error('[music_config] Ошибка загрузки music_config.json:', err);
                showError('Не удалось загрузить music_config.json: ' + err.message);
                musicList = [];
            }
        }

        let initialAssetsLoaded = false;

        async function preloadInitialAssets() {
            if (typeof gsap === 'undefined') {
                showError('Не удалось загрузить библиотеку анимаций (GSAP). Обновите страницу.');
            }
            const startText = document.getElementById('start-text');
            const uiImages = ['assets/icon.png'];
            const trackIcons = [...new Set(musicList.map(t => t.icon).filter(Boolean))];

            const jobs = [
                (set) => document.fonts.load('16px Underdog').catch(() => { }).then(() => set(1)),
                ...uiImages.map(src => (set) => preloadImageAsset(src, set)
                    .catch(err => reportAsset(src, err.message)).then(() => set(1))),
                ...trackIcons.map(src => (set) => preloadImageAsset(src, set)
                    .catch(err => reportAsset(src, err.message)).then(() => set(1)))
            ];

            const progress = new Array(jobs.length).fill(0);
            const render = () => {
                const pct = Math.floor(progress.reduce((a, b) => a + b, 0) / jobs.length * 100);
                startText.textContent = `Идет подгрузка интерфейса ${pct}%`;
            };
            render();

            await Promise.all(jobs.map((job, i) => job(v => { progress[i] = v; render(); })));
            initialAssetsLoaded = true;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await loadMusicConfig();

            const startScreen = document.getElementById('start-screen');
            const startText = document.getElementById('start-text');
            const trackSelectorScreen = document.getElementById('track-selector-screen');
            const trackCarouselViewport = document.getElementById('track-carousel-viewport');
            const trackCarouselRail = document.getElementById('track-carousel-rail');
            const musicPlayerPanel = document.getElementById('music-player-panel');
            const menuBtn = document.getElementById('menu-btn');
            const preloadToast = document.getElementById('preload-toast');
            const preloadToastText = document.getElementById('preload-toast-text');

            const iconPauseEl = document.getElementById('icon-pause');
            const iconPlayEl = document.getElementById('icon-play');
            const trackTitleEl = document.getElementById('track-title');
            const trackArtistEl = document.getElementById('track-artist');
            const playPauseBtn = document.getElementById('play-pause-btn');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const prevTooltipTitle = document.getElementById('prev-tooltip-title');
            const prevTooltipArtist = document.getElementById('prev-tooltip-artist');
            const nextTooltipTitle = document.getElementById('next-tooltip-title');
            const nextTooltipArtist = document.getElementById('next-tooltip-artist');
            const playerVolumeSlider = document.getElementById('player-volume-slider');
            const trackSeekSlider = document.getElementById('track-seek-slider');
            const currentTimeEl = document.getElementById('current-time');
            const totalDurationEl = document.getElementById('total-duration');

            function updateNavTooltips(baseIndex = currentTrackIndex) {
                const len = musicList.length;
                if (!len) return;
                const prevTrack = musicList[(baseIndex - 1 + len) % len];
                const nextTrack = musicList[(baseIndex + 1) % len];

                prevTooltipTitle.textContent = prevTrack.title || 'Без названия';
                prevTooltipArtist.textContent = prevTrack.artist || '';
                nextTooltipTitle.textContent = nextTrack.title || 'Без названия';
                nextTooltipArtist.textContent = nextTrack.artist || '';
            }
            updateNavTooltips(0);

            function setPlayPauseIcon(paused) {
                if (paused) {
                    iconPauseEl.classList.add('hidden');
                    iconPlayEl.classList.remove('hidden');
                    playPauseBtn.title = 'Воспроизвести';
                } else {
                    iconPlayEl.classList.add('hidden');
                    iconPauseEl.classList.remove('hidden');
                    playPauseBtn.title = 'Пауза';
                }
            }

            function syncVolumeSliderFill(val) {
                const pct = Math.min(100, Math.max(0, (Number(val) || 0) * 100));
                playerVolumeSlider.style.setProperty('--vol', `${pct}%`);
            }
            syncVolumeSliderFill(playerVolumeSlider.value);

            const bgStrip = document.getElementById('bg-strip');
            const bg1 = document.getElementById('bg-video-1');
            const bg2 = document.getElementById('bg-video-2');
            const bgSeam = document.getElementById('bg-seam');
            const BG_SLIDE_DURATION = 1.05;
            let activeBg = bg1;
            let nextBg = bg2;
            let currentBgSrc = null;
            let bgTimeline = null;
            let bgFinishFn = null;
            let pendingBgCancel = null;

            [bg1, bg2].forEach(v => {
                v.muted = true;
                v.loop = true;
                v.playsInline = true;
            });
            bg1.style.left = '0%';
            bg2.style.left = '50%';
            gsap.set(bgStrip, { xPercent: 0 });
            gsap.set(bgSeam, { opacity: 0 });

            let isPlaying = false;
            let panelPausedVisual = false;

            function setBgPlayback(play) {
                [bg1, bg2].forEach(v => {
                    if (!v.getAttribute('src')) return;
                    if (play) {
                        v.muted = true;
                        v.play().catch(() => { });
                    } else {
                        v.pause();
                    }
                });
            }

            function setPauseState(paused) {
                if (paused) {
                    setBgPlayback(false);
                    if (!panelPausedVisual) {
                        panelPausedVisual = true;
                        gsap.killTweensOf(musicPlayerPanel);
                        gsap.timeline()
                            .to(musicPlayerPanel, {
                                boxShadow: '-16px 14px 26px rgba(220, 0, 30, 0.85)',
                                duration: 0.15,
                                ease: 'power2.out'
                            })
                            .to(musicPlayerPanel, {
                                boxShadow: '16px 14px 26px rgba(220, 0, 30, 0.85)',
                                duration: 0.5,
                                ease: 'power2.inOut'
                            });
                    }
                } else {
                    setBgPlayback(true);
                    if (panelPausedVisual) {
                        panelPausedVisual = false;
                        gsap.killTweensOf(musicPlayerPanel);
                        gsap.timeline()
                            .to(musicPlayerPanel, {
                                boxShadow: '16px 14px 26px rgba(0, 100, 30, 0.9)',
                                duration: 0.18,
                                ease: 'power2.out'
                            })
                            .to(musicPlayerPanel, {
                                boxShadow: '0px 0px 0px rgba(0, 100, 30, 0)',
                                duration: 0.45,
                                ease: 'power2.inOut'
                            });
                    }
                }
            }

            function commitBgSwap(incoming, outgoing) {
                gsap.killTweensOf([bgStrip, bgSeam]);
                gsap.set(bgStrip, { xPercent: 0 });
                gsap.set(bgSeam, { opacity: 0 });
                incoming.style.left = '0%';
                outgoing.pause();
                outgoing.removeAttribute('src');
                outgoing.load();
                outgoing.style.left = '50%';
            }

            function finishBgSwapImmediate() {
                if (bgTimeline) {
                    bgTimeline.kill();
                    bgTimeline = null;
                }
                if (bgFinishFn) {
                    const fn = bgFinishFn;
                    bgFinishFn = null;
                    fn();
                }
            }

            function changeBackground(videoSrc, direction = 'next', onStart = () => { }) {
                if (pendingBgCancel) {
                    pendingBgCancel();
                    pendingBgCancel = null;
                }
                if (!videoSrc || videoSrc === currentBgSrc) {
                    onStart();
                    return;
                }
                finishBgSwapImmediate();

                const isFirstBg = currentBgSrc === null;
                const incoming = nextBg;
                const outgoing = activeBg;
                let started = false;
                let fallbackTimer = null;

                const cleanup = () => {
                    if (fallbackTimer) {
                        clearTimeout(fallbackTimer);
                        fallbackTimer = null;
                    }
                    incoming.removeEventListener('canplay', startSlide);
                    incoming.removeEventListener('loadeddata', startSlide);
                    incoming.removeEventListener('error', onError);
                };

                function startSlide() {
                    if (started) return;
                    started = true;
                    cleanup();
                    pendingBgCancel = null;

                    currentBgSrc = videoSrc;
                    activeBg = incoming;
                    nextBg = outgoing;

                    incoming.muted = true;
                    if (isPlaying) incoming.play().catch(() => { });
                    else incoming.pause();

                    onStart();

                    if (isFirstBg) {
                        commitBgSwap(incoming, outgoing);
                        return;
                    }

                    const isNext = direction !== 'prev';
                    outgoing.style.left = isNext ? '0%' : '50%';
                    incoming.style.left = isNext ? '50%' : '0%';
                    gsap.set(bgStrip, { xPercent: isNext ? 0 : -50 });
                    gsap.set(bgSeam, { opacity: 0 });

                    bgFinishFn = () => commitBgSwap(incoming, outgoing);
                    bgTimeline = gsap.timeline({
                        onComplete: () => {
                            bgTimeline = null;
                            const fn = bgFinishFn;
                            bgFinishFn = null;
                            if (fn) fn();
                        }
                    });

                    bgTimeline
                        .to(bgStrip, {
                            xPercent: isNext ? -50 : 0,
                            duration: BG_SLIDE_DURATION,
                            ease: 'power2.inOut'
                        }, 0)
                        .to(bgSeam, { opacity: 1, duration: 0.18, ease: 'power1.out' }, 0)
                        .to(bgSeam, { opacity: 0, duration: 0.35, ease: 'power1.in' }, BG_SLIDE_DURATION - 0.35);
                }

                function onError() {
                    if (started) return;
                    started = true;
                    cleanup();
                    pendingBgCancel = null;
                    reportAsset(videoSrc, 'не удалось загрузить фон');
                    onStart();
                }

                pendingBgCancel = () => {
                    started = true;
                    cleanup();
                };

                incoming.pause();
                incoming.removeAttribute('src');
                incoming.load();

                incoming.addEventListener('canplay', startSlide);
                incoming.addEventListener('loadeddata', startSlide);
                incoming.addEventListener('error', onError);
                fallbackTimer = setTimeout(startSlide, 4000);

                incoming.muted = true;
                incoming.src = cached(videoSrc);
                incoming.load();
            }

            const trackInfoEl = document.querySelector('.track-info');
            function swapTrackInfo(track, direction = 'next') {
                const apply = () => {
                    trackTitleEl.textContent = track.title || 'Без названия';
                    trackArtistEl.textContent = track.artist || '';
                };
                gsap.killTweensOf(trackInfoEl);
                if (musicPlayerPanel.classList.contains('hidden')) {
                    apply();
                    gsap.set(trackInfoEl, { x: 0, opacity: 1 });
                    return;
                }
                const dir = direction === 'prev' ? -1 : 1;
                gsap.timeline()
                    .to(trackInfoEl, { x: -26 * dir, opacity: 0, duration: 0.22, ease: 'power2.in' })
                    .add(apply)
                    .fromTo(trackInfoEl,
                        { x: 26 * dir, opacity: 0 },
                        { x: 0, opacity: 1, duration: 0.4, ease: 'power2.out' });
            }

            const audio1 = document.getElementById('music-player-1');
            const audio2 = document.getElementById('music-player-2');
            let activeAudio = audio1;
            let nextAudio = audio2;
            let targetVolume = Number.isFinite(parseFloat(playerVolumeSlider.value)) ? parseFloat(playerVolumeSlider.value) : 0.3;
            let isCrossfading = false;
            let currentTrackIndex = 0;
            let targetIndex = 0;
            let hasPlayedAnyTrack = false;
            let loadToken = 0;
            let loadingTrack = false;
            let isUserSeeking = false;

            function formatTrackTime(seconds) {
                if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${String(secs).padStart(2, '0')}`;
            }

            function syncProgressUI(audio = activeAudio) {
                const duration = audio && Number.isFinite(audio.duration) ? audio.duration : 0;
                const current = audio && Number.isFinite(audio.currentTime) ? audio.currentTime : 0;

                totalDurationEl.textContent = formatTrackTime(duration);

                if (!isUserSeeking) {
                    currentTimeEl.textContent = formatTrackTime(current);
                    const pct = duration > 0 ? Math.min(100, Math.max(0, (current / duration) * 100)) : 0;
                    trackSeekSlider.value = pct;
                    trackSeekSlider.style.setProperty('--progress', `${pct}%`);
                }
            }

            trackSeekSlider.addEventListener('input', () => {
                isUserSeeking = true;
                const pct = parseFloat(trackSeekSlider.value) || 0;
                trackSeekSlider.style.setProperty('--progress', `${pct}%`);
                if (activeAudio && Number.isFinite(activeAudio.duration) && activeAudio.duration > 0) {
                    currentTimeEl.textContent = formatTrackTime((pct / 100) * activeAudio.duration);
                }
            });

            function commitSeek() {
                if (!isUserSeeking) return;
                isUserSeeking = false;
                const pct = parseFloat(trackSeekSlider.value) || 0;
                if (activeAudio && Number.isFinite(activeAudio.duration) && activeAudio.duration > 0) {
                    activeAudio.currentTime = (pct / 100) * activeAudio.duration;
                }
                syncProgressUI(activeAudio);
            }

            trackSeekSlider.addEventListener('change', commitSeek);
            trackSeekSlider.addEventListener('pointerup', commitSeek);

            let midpointPreloadTriggeredFor = null;
            let preloadToastHideTimer = null;
            let preloadGlowHideTimer = null;
            let preloadJobId = 0;

            function showPreloadToast(text, isLoaded = false) {
                if (preloadToastHideTimer) {
                    clearTimeout(preloadToastHideTimer);
                    preloadToastHideTimer = null;
                }
                if (preloadGlowHideTimer) {
                    clearTimeout(preloadGlowHideTimer);
                    preloadGlowHideTimer = null;
                }

                preloadToast.classList.toggle('loaded', isLoaded);
                if (isLoaded) {
                    preloadGlowHideTimer = setTimeout(() => {
                        preloadToast.classList.remove('loaded');
                        preloadGlowHideTimer = null;
                    }, 1000);
                }

                const wasVisible = preloadToast.classList.contains('visible');

                if (!wasVisible) {
                    gsap.killTweensOf(preloadToastText);
                    gsap.set(preloadToastText, { opacity: 1, y: 0 });
                    preloadToastText.textContent = text;
                    preloadToast.classList.add('visible');
                } else if (preloadToastText.textContent !== text) {
                    gsap.killTweensOf(preloadToastText);
                    gsap.to(preloadToastText, {
                        opacity: 0,
                        y: -6,
                        duration: 0.2,
                        ease: 'power2.in',
                        onComplete: () => {
                            preloadToastText.textContent = text;
                            gsap.fromTo(
                                preloadToastText,
                                { opacity: 0, y: 6 },
                                { opacity: 1, y: 0, duration: 0.25, ease: 'power2.out' }
                            );
                        }
                    });
                }
            }

            function hidePreloadToastAfter(delayMs = 3000) {
                if (preloadToastHideTimer) {
                    clearTimeout(preloadToastHideTimer);
                }
                preloadToastHideTimer = setTimeout(() => {
                    preloadToast.classList.remove('visible');
                    preloadToast.classList.remove('loaded');
                    preloadToastHideTimer = null;
                }, delayMs);
            }

            function checkMidpointPreload() {
                if (!isPlaying || loadingTrack || musicList.length <= 1) return;
                if (!activeAudio.duration || isNaN(activeAudio.duration)) return;

                if (activeAudio.currentTime >= activeAudio.duration / 2) {
                    const nextIdx = (currentTrackIndex + 1) % musicList.length;
                    if (midpointPreloadTriggeredFor === nextIdx) return;
                    midpointPreloadTriggeredFor = nextIdx;

                    const nextTrack = musicList[nextIdx];
                    const needed = [nextTrack.audio, nextTrack.bg].filter(Boolean);
                    if (!needed.length || needed.every(src => assetCache.has(src))) return;

                    const myJobId = ++preloadJobId;
                    showPreloadToast('Началась загрузка следующего трека', false);

                    Promise.all(
                        needed.map(src => loadAsset(src).catch(err => reportAsset(src, err.message)))
                    ).then(() => {
                        if (myJobId !== preloadJobId) return;
                        showPreloadToast('Следующий трек загружен', true);
                        hidePreloadToastAfter(3000);
                    });
                }
            }

            [audio1, audio2].forEach(audio => {
                audio.addEventListener('timeupdate', () => {
                    if (audio === activeAudio) {
                        checkMidpointPreload();
                        syncProgressUI(audio);
                    }
                });
                audio.addEventListener('loadedmetadata', () => {
                    if (audio === activeAudio) syncProgressUI(audio);
                });
                audio.addEventListener('durationchange', () => {
                    if (audio === activeAudio) syncProgressUI(audio);
                });
            });

            function getEffectiveTrackVolume(track = musicList[currentTrackIndex]) {
                const multiplier = track ? parseMultiplier(track.sound_multiplier) : 1;
                return clampVolume(targetVolume * multiplier);
            }

            audio1.volume = 0;
            audio2.volume = 0;
            [audio1, audio2].forEach(a => a.addEventListener('error', () => {
                if (a.getAttribute('src')) reportAsset(a.dataset.orig || a.getAttribute('src'), 'ошибка воспроизведения');
            }));

            let activeSelectorIndex = 0;
            let selectorOpen = false;
            const trackCardRefs = [];

            function buildTrackCarousel() {
                trackCarouselRail.innerHTML = '';
                trackCardRefs.length = 0;

                musicList.forEach((track, idx) => {
                    const card = document.createElement('div');
                    card.className = 'track-card';
                    card.dataset.index = String(idx);

                    const loadBox = document.createElement('div');
                    loadBox.className = 'track-load-box';

                    const loadLabel = document.createElement('div');
                    loadLabel.className = 'track-load-label';
                    loadLabel.textContent = 'Загрузка 0%';

                    const loadBar = document.createElement('div');
                    loadBar.className = 'track-load-bar';

                    const loadFill = document.createElement('div');
                    loadFill.className = 'track-load-fill';

                    loadBar.appendChild(loadFill);
                    loadBox.append(loadLabel, loadBar);

                    const roundPct = parseRoundIcon(track.round_icon);
                    const iconFrame = document.createElement('div');
                    iconFrame.className = 'track-icon-frame';
                    iconFrame.style.borderRadius = `${roundPct}%`;

                    const img = document.createElement('img');
                    img.src = cached(track.icon || 'assets/icon.png');
                    img.alt = track.title || `Трек ${idx + 1}`;
                    img.style.borderRadius = `${roundPct}%`;
                    img.onerror = () => {
                        if (track.icon) reportAsset(track.icon, 'ошибка отображения иконки');
                        img.onerror = null;
                        img.src = cached('assets/icon.png');
                    };

                    const playBadge = document.createElement('div');
                    playBadge.className = 'track-play-badge';
                    playBadge.style.borderRadius = `${roundPct}%`;
                    playBadge.innerHTML = `
                        <svg width="58" height="58" viewBox="0 0 56 56" fill="none" aria-hidden="true">
                            <circle cx="28" cy="28" r="25" fill="url(#player-icon-grad)" />
                            <path d="M23 18.5C23 17.3 24.3 16.6 25.3 17.2L38.2 25.7C39.1 26.3 39.1 27.7 38.2 28.3L25.3 36.8C24.3 37.4 23 36.7 23 35.5V18.5Z" fill="#12091d" />
                        </svg>
                    `;

                    iconFrame.append(img, playBadge);

                    const meta = document.createElement('div');
                    meta.className = 'track-card-meta';

                    const titleEl = document.createElement('div');
                    titleEl.className = 'track-card-title';
                    titleEl.textContent = track.title || 'Без названия';

                    const artistEl = document.createElement('div');
                    artistEl.className = 'track-card-artist';
                    artistEl.textContent = track.artist || '';

                    meta.append(titleEl, artistEl);
                    card.append(loadBox, iconFrame, meta);

                    card.addEventListener('click', () => {
                        if (!selectorOpen) return;
                        if (idx !== activeSelectorIndex) {
                            setSelectorIndex(idx, true);
                        } else {
                            handleActiveCardActivate(idx);
                        }
                    });

                    trackCarouselRail.appendChild(card);
                    trackCardRefs.push({ card, loadBox, loadLabel, loadFill });
                });
            }

            function updateCardLoadProgress(index, ratio, statusText = null) {
                const ref = trackCardRefs[index];
                if (!ref) return;
                const pct = Math.round(Math.min(1, Math.max(0, ratio)) * 100);
                ref.card.classList.add('loading');
                ref.loadBox.classList.add('visible');
                ref.loadFill.style.width = `${pct}%`;
                ref.loadLabel.textContent = statusText || `Загрузка ${pct}%`;
            }

            function clearCardLoadProgress(index) {
                const ref = trackCardRefs[index];
                if (!ref) return;
                ref.card.classList.remove('loading');
                ref.loadBox.classList.remove('visible');
                ref.loadFill.style.width = '0%';
                ref.loadLabel.textContent = 'Загрузка 0%';
            }

            function updateCarouselPosition(animate = true) {
                if (!trackCardRefs.length) return;
                trackCardRefs.forEach((ref, i) => {
                    ref.card.classList.toggle('active', i === activeSelectorIndex);
                    if (i !== activeSelectorIndex && !loadingTrack) {
                        clearCardLoadProgress(i);
                    }
                });

                const activeCard = trackCardRefs[activeSelectorIndex].card;
                const viewportWidth = trackCarouselViewport.clientWidth || window.innerWidth;
                const cardCenter = activeCard.offsetLeft + activeCard.offsetWidth / 2;
                const offsetX = viewportWidth / 2 - cardCenter;

                trackCarouselRail.style.transition = animate
                    ? 'transform 0.45s cubic-bezier(0.22, 1, 0.36, 1)'
                    : 'none';
                trackCarouselRail.style.transform = `translateX(${offsetX}px)`;
            }

            function setSelectorIndex(newIndex, animate = true) {
                if (!musicList.length) return;
                const clamped = Math.max(0, Math.min(musicList.length - 1, newIndex));
                if (clamped === activeSelectorIndex && animate) return;

                if (loadingTrack) {
                    loadToken++;
                    loadingTrack = false;
                    clearCardLoadProgress(activeSelectorIndex);
                }

                activeSelectorIndex = clamped;
                updateCarouselPosition(animate);
            }

            function openTrackSelector(focusIndex = currentTrackIndex) {
                if (!musicList.length) return;
                selectorOpen = true;
                activeSelectorIndex = Math.max(0, Math.min(musicList.length - 1, focusIndex));
                trackSelectorScreen.classList.remove('selector-hidden');
                musicPlayerPanel.classList.add('hidden');
                requestAnimationFrame(() => updateCarouselPosition(false));
            }

            function closeTrackSelector() {
                selectorOpen = false;
                trackSelectorScreen.classList.add('selector-hidden');
                musicPlayerPanel.classList.remove('hidden');
            }

            let wheelAccum = 0;
            let wheelResetTimer = null;
            trackSelectorScreen.addEventListener('wheel', (e) => {
                if (!selectorOpen || !musicList.length) return;
                e.preventDefault();

                const delta = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
                wheelAccum += delta;

                clearTimeout(wheelResetTimer);
                wheelResetTimer = setTimeout(() => { wheelAccum = 0; }, 160);

                const THRESHOLD = 45;
                if (wheelAccum >= THRESHOLD) {
                    wheelAccum = 0;
                    setSelectorIndex(activeSelectorIndex + 1, true);
                } else if (wheelAccum <= -THRESHOLD) {
                    wheelAccum = 0;
                    setSelectorIndex(activeSelectorIndex - 1, true);
                }
            }, { passive: false });

            window.addEventListener('resize', () => {
                if (selectorOpen) updateCarouselPosition(false);
            });

            menuBtn.addEventListener('click', () => {
                openTrackSelector(currentTrackIndex);
            });

            async function handleActiveCardActivate(index) {
                if (loadingTrack) return;

                if (hasPlayedAnyTrack && currentTrackIndex === index && !isCrossfading) {
                    closeTrackSelector();
                    if (activeAudio.paused) {
                        activeAudio.play().catch(() => { });
                        isPlaying = true;
                        setPlayPauseIcon(false);
                        setPauseState(false);
                        startSubsChecker();
                    }
                    return;
                }

                const dir = index < currentTrackIndex ? 'prev' : 'next';
                await switchToTrack(index, { fromSelector: true, direction: dir });
            }

            const subsTextEl = document.getElementById('subtitles-text');
            const SUBS_DISPLAY_DURATION = 4;
            let subsTimer = null;
            let subsCheckInterval = null;
            let currentSubsKey = null;
            let lastCheckTime = 0;
            let subsEnabled = true;

            function getCurrentSubtitles() {
                const track = musicList[currentTrackIndex];
                return track && track.subtitles ? track.subtitles : null;
            }

            function showSubsText(key, entry) {
                currentSubsKey = key;

                let displayText, glowColor;
                if (typeof entry === 'object' && entry !== null && entry.text) {
                    displayText = entry.text;
                    glowColor = entry.glow || null;
                } else {
                    displayText = entry;
                    glowColor = null;
                }

                subsTextEl.textContent = displayText;

                if (typeof glowColor === 'string' && glowColor.trim().toLowerCase() === 'none') {
                    subsTextEl.style.textShadow = 'none';
                } else if (glowColor) {
                    subsTextEl.style.textShadow = `
                        0 0 10px ${glowColor},
                        0 0 20px ${glowColor},
                        0 0 40px ${glowColor},
                        0 0 80px ${glowColor}
                    `;
                } else {
                    subsTextEl.style.textShadow = '';
                }

                subsTextEl.className = '';
                void subsTextEl.offsetWidth;
                subsTextEl.classList.add('show');

                if (subsTimer) clearTimeout(subsTimer);
                subsTimer = setTimeout(() => {
                    subsTextEl.classList.remove('show');
                    subsTextEl.classList.add('hide');
                    currentSubsKey = null;
                    setTimeout(() => {
                        if (!subsTextEl.classList.contains('show')) {
                            subsTextEl.className = '';
                            subsTextEl.style.textShadow = '';
                        }
                    }, 300);
                }, SUBS_DISPLAY_DURATION * 1000);
            }

            function checkSubsTime() {
                if (!isPlaying || !subsEnabled) return;

                const subtitles = getCurrentSubtitles();
                if (!subtitles) {
                    if (currentSubsKey !== null) {
                        subsTextEl.classList.remove('show');
                        subsTextEl.classList.add('hide');
                        currentSubsKey = null;
                        setTimeout(() => {
                            if (!subsTextEl.classList.contains('show')) {
                                subsTextEl.className = '';
                                subsTextEl.style.textShadow = '';
                            }
                        }, 300);
                    }
                    return;
                }

                const currentTime = activeAudio.currentTime;

                if (currentTime < lastCheckTime - 0.05) {
                    lastCheckTime = currentTime;
                    return;
                }

                let latestKey = null;
                let latestTime = -Infinity;

                for (const key in subtitles) {
                    const t = parseFloat(key);
                    if (isNaN(t)) continue;
                    if (t > lastCheckTime && t <= currentTime + 0.001) {
                        if (t > latestTime) {
                            latestTime = t;
                            latestKey = key;
                        }
                    }
                }

                lastCheckTime = currentTime;

                if (latestKey && currentSubsKey !== latestKey) {
                    showSubsText(latestKey, subtitles[latestKey]);
                }
            }

            function startSubsChecker() {
                stopSubsChecker();
                lastCheckTime = activeAudio.currentTime;
                subsCheckInterval = setInterval(checkSubsTime, 100);
            }

            function stopSubsChecker() {
                if (subsCheckInterval) {
                    clearInterval(subsCheckInterval);
                    subsCheckInterval = null;
                }
                if (subsTimer) {
                    clearTimeout(subsTimer);
                    subsTimer = null;
                }
                currentSubsKey = null;
                if (subsTextEl.classList.contains('show')) {
                    subsTextEl.classList.remove('show');
                    subsTextEl.classList.add('hide');
                    setTimeout(() => {
                        if (!subsTextEl.classList.contains('show')) {
                            subsTextEl.className = '';
                            subsTextEl.style.textShadow = '';
                        }
                    }, 300);
                } else {
                    subsTextEl.className = '';
                    subsTextEl.style.textShadow = '';
                }
            }

            function handleSeekReset(e) {
                const audio = e.target;
                if (audio !== activeAudio) return;
                lastCheckTime = audio.currentTime - 0.5;
                if (currentSubsKey !== null) {
                    subsTextEl.classList.remove('show');
                    subsTextEl.classList.add('hide');
                    currentSubsKey = null;
                    setTimeout(() => {
                        if (!subsTextEl.classList.contains('show')) {
                            subsTextEl.className = '';
                            subsTextEl.style.textShadow = '';
                        }
                    }, 300);
                }
            }
            audio1.addEventListener('seeking', handleSeekReset);
            audio2.addEventListener('seeking', handleSeekReset);

            const playerLoadBar = document.getElementById('player-load-bar');
            const playerLoadFill = document.getElementById('player-load-fill');
            const playerLoadLabel = document.getElementById('player-load-label');
            let playerLoadTitle = '';
            let playerLoadResetTimer = null;

            function formatMB(bytes) {
                return (bytes / (1024 * 1024)).toFixed(1).replace('.', ',');
            }

            function showPlayerLoadBar(track) {
                clearTimeout(playerLoadResetTimer);
                playerLoadResetTimer = null;
                playerLoadTitle = (track && track.title) || '';
                playerLoadFill.style.transition = 'none';
                playerLoadFill.style.transform = 'scaleX(0)';
                void playerLoadFill.offsetWidth;
                playerLoadFill.style.transition = '';
                playerLoadBar.classList.add('visible', 'indeterminate');
                playerLoadLabel.textContent = playerLoadTitle ? `Загрузка «${playerLoadTitle}»…` : 'Загрузка трека…';
                playerLoadLabel.classList.add('visible');
            }

            function setPlayerLoadBar(info) {
                const head = playerLoadTitle ? `Загрузка «${playerLoadTitle}»` : 'Загрузка трека';
                if (!info || !info.known) {
                    playerLoadBar.classList.add('indeterminate');
                    playerLoadLabel.textContent = info && info.loaded > 0
                        ? `${head} · ${formatMB(info.loaded)} МБ`
                        : `${head}…`;
                    return;
                }
                playerLoadBar.classList.remove('indeterminate');
                const pct = Math.round(info.ratio * 100);
                playerLoadFill.style.transform = `scaleX(${info.ratio})`;
                playerLoadLabel.textContent = `${head} · ${pct}% (${formatMB(info.loaded)} / ${formatMB(info.total)} МБ)`;
            }

            function hidePlayerLoadBar() {
                playerLoadBar.classList.remove('visible');
                playerLoadLabel.classList.remove('visible');
                clearTimeout(playerLoadResetTimer);
                playerLoadResetTimer = setTimeout(() => {
                    playerLoadResetTimer = null;
                    if (playerLoadBar.classList.contains('visible')) return;
                    playerLoadBar.classList.remove('indeterminate');
                    playerLoadFill.style.transition = 'none';
                    playerLoadFill.style.transform = 'scaleX(0)';
                    void playerLoadFill.offsetWidth;
                    playerLoadFill.style.transition = '';
                }, 350);
            }

            function crossfadeToTrack(index, direction = 'next') {
                if (!musicList.length) return;
                if (isCrossfading) {
                    gsap.killTweensOf([activeAudio, nextAudio]);
                    activeAudio.pause();
                    activeAudio.currentTime = 0;
                    nextAudio.pause();
                    nextAudio.currentTime = 0;
                    nextAudio.volume = 0;
                    activeAudio.volume = getEffectiveTrackVolume();
                    isCrossfading = false;
                }

                isCrossfading = true;
                currentTrackIndex = index;
                hasPlayedAnyTrack = true;
                midpointPreloadTriggeredFor = null;
                const track = musicList[currentTrackIndex];

                isPlaying = true;
                setPauseState(false);

                updateNavTooltips(currentTrackIndex);
                changeBackground(track.bg, direction, () => swapTrackInfo(track, direction));

                stopSubsChecker();

                nextAudio.dataset.orig = track.audio;
                nextAudio.src = cached(track.audio);
                nextAudio.volume = 0;
                nextAudio.currentTime = 0;
                nextAudio.play().catch(() => { });

                const oldAudio = activeAudio;
                const newAudio = nextAudio;
                activeAudio = newAudio;
                nextAudio = oldAudio;

                setPlayPauseIcon(false);

                startSubsChecker();

                gsap.to(oldAudio, {
                    volume: 0, duration: 1, ease: 'power1.inOut',
                    onComplete: () => {
                        oldAudio.pause();
                        oldAudio.currentTime = 0;
                    }
                });

                gsap.to(newAudio, {
                    volume: getEffectiveTrackVolume(track), duration: 1, ease: 'power1.inOut',
                    onComplete: () => {
                        isCrossfading = false;
                    }
                });

                syncProgressUI(newAudio);
            }

            let pauseCooldown = false;

            function togglePlayPause() {
                if (activeAudio.paused) {
                    activeAudio.play();
                    isPlaying = true;
                    setPlayPauseIcon(false);
                    setPauseState(false);
                    pauseCooldown = true;
                    setTimeout(() => { pauseCooldown = false; }, 1000);
                    startSubsChecker();
                } else {
                    if (pauseCooldown && !debugVisible) return;

                    activeAudio.pause();
                    isPlaying = false;
                    setPlayPauseIcon(true);
                    setPauseState(true);
                    stopSubsChecker();
                }
            }

            async function switchToTrack(index, { fromSelector = false, direction = 'next' } = {}) {
                if (!musicList.length) return;
                targetIndex = index;
                const myToken = ++loadToken;
                loadingTrack = false;
                hidePlayerLoadBar();
                clearCardLoadProgress(index);
                updateNavTooltips(index);

                const track = musicList[index];
                const needed = [track.audio, track.bg].filter(Boolean);
                const missing = needed.filter(src => !assetCache.has(src));

                if (missing.length) {
                    if (fromSelector) {
                        if (!activeAudio.paused) {
                            activeAudio.pause();
                        }
                        isPlaying = false;
                        setPlayPauseIcon(true);
                        setPauseState(true);
                        stopSubsChecker();
                    }

                    loadingTrack = true;
                    const useCard = fromSelector || selectorOpen;

                    if (useCard) {
                        updateCardLoadProgress(index, 0, 'Загрузка 0%');
                    } else {
                        showPlayerLoadBar(track);
                    }

                    await loadAssetsWithProgress(missing, (info) => {
                        if (myToken !== loadToken) return;
                        if (useCard) {
                            updateCardLoadProgress(index, info.known ? info.ratio : 0);
                        } else {
                            setPlayerLoadBar(info);
                        }
                    });

                    if (myToken !== loadToken) return;

                    loadingTrack = false;
                    if (useCard) {
                        clearCardLoadProgress(index);
                    } else {
                        hidePlayerLoadBar();
                    }
                }

                if (selectorOpen) {
                    closeTrackSelector();
                }
                crossfadeToTrack(index, direction);
            }

            function playNext() {
                if (!musicList.length) return;
                const base = loadingTrack ? targetIndex : currentTrackIndex;
                switchToTrack((base + 1) % musicList.length, { direction: 'next' });
            }

            function playPrev() {
                if (!musicList.length) return;
                const base = loadingTrack ? targetIndex : currentTrackIndex;
                switchToTrack((base - 1 + musicList.length) % musicList.length, { direction: 'prev' });
            }

            function handleAudioEnded(e) {
                if (!isCrossfading && !loadingTrack && e.target === activeAudio) {
                    playNext();
                }
            }
            audio1.addEventListener('ended', handleAudioEnded);
            audio2.addEventListener('ended', handleAudioEnded);

            playPauseBtn.addEventListener('click', togglePlayPause);
            nextBtn.addEventListener('click', playNext);
            prevBtn.addEventListener('click', playPrev);

            playerVolumeSlider.addEventListener('input', (e) => {
                targetVolume = parseFloat(e.target.value);
                syncVolumeSliderFill(targetVolume);
                gsap.to(activeAudio, { volume: getEffectiveTrackVolume(), duration: 0.2 });
            });

            let startTextContent = '';
            let startIndex = 0;
            let startCursorVisible = true;
            let typeWriterInterval;
            let typewriterComplete = false;

            function runStartScreenEffect() {
                const finalMessage = "Ровно через клик мы откроем выбор музыки, , ,";
                if (!initialAssetsLoaded) {
                    typeWriterInterval = setTimeout(runStartScreenEffect, 100);
                } else if (!typewriterComplete) {
                    if (startIndex <= finalMessage.length) {
                        startTextContent = finalMessage.slice(0, startIndex);
                        startText.textContent = startTextContent + (startCursorVisible ? '|' : ' ');
                        if (startIndex < finalMessage.length) startIndex++;
                        typeWriterInterval = setTimeout(runStartScreenEffect, 100);
                    } else {
                        typewriterComplete = true;
                        setInterval(() => {
                            startCursorVisible = !startCursorVisible;
                            startText.textContent = startTextContent + (startCursorVisible ? '|' : ' ');
                        }, 500);
                    }
                }
            }
            runStartScreenEffect();

            function handleStartScreenClick() {
                if (!initialAssetsLoaded) return;
                clearTimeout(typeWriterInterval);
                startScreen.classList.add('hidden');
                if (musicList.length > 0) {
                    openTrackSelector(0);
                } else {
                    musicPlayerPanel.classList.remove('hidden');
                    trackTitleEl.textContent = 'Треки не найдены';
                    trackArtistEl.textContent = 'Проверьте music_config.json';
                }
            }

            startScreen.addEventListener('click', handleStartScreenClick);
            startScreen.addEventListener('touchstart', (e) => {
                if (!initialAssetsLoaded || !typewriterComplete) { e.preventDefault(); return; }
                handleStartScreenClick();
            });

            const debugTimeDisplay = document.getElementById('debug-time-display');
            const debugSeekModal = document.getElementById('debug-seek-modal');
            const debugSeekInput = document.getElementById('debug-seek-input');
            const debugTimeText = document.getElementById('debug-time-text');
            let debugTimeInterval = null;
            let debugVisible = false;

            function formatTime(seconds) {
                if (!seconds || isNaN(seconds)) return '0.000';
                const s = Math.floor(seconds);
                const ms = Math.floor((seconds % 1) * 1000);
                return String(s) + '.' + String(ms).padStart(3, '0');
            }

            function updateDebugTime() {
                const audio = activeAudio;
                if (audio && audio.duration && !isNaN(audio.duration)) {
                    debugTimeText.textContent = formatTime(audio.currentTime);
                } else {
                    debugTimeText.textContent = '0.000';
                }
            }

            function showDebugTime() {
                debugVisible = true;
                debugTimeDisplay.style.display = 'flex';
                updateDebugTime();
                if (debugTimeInterval) clearInterval(debugTimeInterval);
                debugTimeInterval = setInterval(updateDebugTime, 50);
            }

            function hideDebugTime() {
                debugVisible = false;
                debugTimeDisplay.style.display = 'none';
                if (debugTimeInterval) {
                    clearInterval(debugTimeInterval);
                    debugTimeInterval = null;
                }
            }

            function openSeekModal() {
                if (!debugVisible) return;
                const audio = activeAudio;
                if (audio && audio.duration && !isNaN(audio.duration)) {
                    debugSeekInput.value = String(Math.floor(audio.currentTime));
                } else {
                    debugSeekInput.value = '0';
                }
                debugSeekModal.classList.add('open');
                debugSeekInput.focus();
                debugSeekInput.select();
            }

            function closeSeekModal() {
                debugSeekModal.classList.remove('open');
            }

            function applySeek() {
                const val = debugSeekInput.value.trim();
                if (!val) { closeSeekModal(); return; }
                const seconds = parseInt(val, 10);
                if (isNaN(seconds) || seconds < 0) { closeSeekModal(); return; }
                const audio = activeAudio;
                if (audio && audio.duration && !isNaN(audio.duration)) {
                    audio.currentTime = Math.min(seconds, audio.duration);
                }
                closeSeekModal();
            }

            document.addEventListener('keydown', (e) => {
                if (selectorOpen && !debugSeekModal.classList.contains('open')) {
                    if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        setSelectorIndex(activeSelectorIndex + 1, true);
                    } else if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        setSelectorIndex(activeSelectorIndex - 1, true);
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        handleActiveCardActivate(activeSelectorIndex);
                    } else if (e.key === 'Escape' && hasPlayedAnyTrack) {
                        e.preventDefault();
                        closeTrackSelector();
                    }
                }

                if (DEBUG_ENABLED && (e.code === 'F3' || (e.code === 'KeyD' && e.ctrlKey && e.shiftKey))) {
                    e.preventDefault();
                    if (debugVisible) {
                        hideDebugTime();
                    } else {
                        showDebugTime();
                    }
                }
                if (e.key === 'Escape' && debugSeekModal.classList.contains('open')) {
                    closeSeekModal();
                }
                if (e.key === 'Enter' && debugSeekModal.classList.contains('open')) {
                    applySeek();
                }
            });

            debugTimeText.addEventListener('click', openSeekModal);

            document.getElementById('debug-seek-back').addEventListener('click', (e) => {
                e.stopPropagation();
                const audio = activeAudio;
                if (audio && audio.duration && !isNaN(audio.duration)) {
                    audio.currentTime = Math.max(0, audio.currentTime - 5);
                }
            });

            document.getElementById('debug-seek-forward').addEventListener('click', (e) => {
                e.stopPropagation();
                const audio = activeAudio;
                if (audio && audio.duration && !isNaN(audio.duration)) {
                    audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
                }
            });

            document.getElementById('debug-seek-apply').addEventListener('click', applySeek);
            document.getElementById('debug-seek-cancel').addEventListener('click', closeSeekModal);

            document.getElementById('debug-subs-checkbox').addEventListener('change', (e) => {
                subsEnabled = !e.target.checked;
                if (!subsEnabled) {
                    stopSubsChecker();
                } else if (isPlaying) {
                    startSubsChecker();
                }
            });

            await preloadInitialAssets();
            buildTrackCarousel();
        });
    </script>
</body>

</html>
